[package]
name = "hearth"
description = "Hearth: a lightweight home-server manager (CLI, daemon and privileged helper in one binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "hearth"
path = "src/main.rs"

[dependencies]
hearth-core.workspace = true
hearth-registry.workspace = true
hearth-casaos.workspace = true
serde_yaml_ng.workspace = true
similar.workspace = true
tar.workspace = true
flate2.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
rusqlite.workspace = true
rustix = { workspace = true, features = ["fs", "termios", "process"] }
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
reqwest.workspace = true
futures-util.workspace = true
jiff.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
time = "0.3.55"
argon2 = { version = "0.5", features = ["std"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
if-addrs = "0.15.0"
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
