name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch new advisories even without commits

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: store tool (hearth-store --features tool)
        run: cargo clippy -p hearth-store --features tool --all-targets --locked && cargo test -p hearth-store --features tool --locked

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  ui:
    name: web UI (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v6
        with:
          name: ui-build
          path: ui/build
          retention-days: 14

  build:
    name: static build (${{ matrix.target }})
    needs: [check, ui]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v6
        with:
          name: ui-build
          path: ui/build
      - name: Install zig + cargo-zigbuild
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p hearth
      - name: Check the binary is static and report its size
        run: |
          bin=target/${{ matrix.target }}/release/hearth
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked' || { echo "binary is not static"; exit 1; }
          ls -l "$bin"
      - uses: actions/upload-artifact@v6
        with:
          name: hearth-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hearth
          retention-days: 14

  smoke:
    name: end-to-end smoke test + memory budget
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: hearth-x86_64-unknown-linux-musl
          path: dist
      - run: chmod +x dist/hearth
      - run: ci/smoke.sh dist/hearth

  e2e:
    name: web UI end-to-end (desktop + phone)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: hearth-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: chmod +x dist/hearth
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: ci/e2e.sh dist/hearth
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-results
          path: ui/test-results
          retention-days: 7
