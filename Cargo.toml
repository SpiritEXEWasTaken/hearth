[workspace]
resolver = "3"
members = ["crates/hearth-core", "crates/hearth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SpiritEXEWasTaken/hearth"
authors = ["Hearth contributors"]

[workspace.dependencies]
hearth-core = { path = "crates/hearth-core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
opt-level = "s"      # small binary; this runs on low-RAM home servers
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
