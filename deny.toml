# cargo-deny: licence, advisory and source checks (run in CI).
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# internal path dependencies (hearth-core) are fine: these crates are never published
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
